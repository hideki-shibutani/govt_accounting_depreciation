name: Update depreciation data

on:
  schedule:
    - cron: '17 3 1 * *' # 毎月1日12:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: depreciation-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_csv.py --record build-record.json
      - name: Publish CSV and monthly verification record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- facilities_depreciation.csv prefecture_overall.csv municipality_overall.csv prefecture/ municipality/ build-record.json
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Update depreciation data and verification record'
          git push origin HEAD:main
